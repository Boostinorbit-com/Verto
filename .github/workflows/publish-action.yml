# Builds the BOOSTOPT GitHub Action image and pushes it to GHCR, so that
# `uses: boostopt/boostopt@v1` (a Docker action) can resolve `runs.image` in action.yml.
#
# Fires on a version tag (v1.2.3) — publishing :v1.2.3, :v1, and :latest — or by hand.
# Publishes to ghcr.io/<owner>/action; action.yml's `runs.image` must match that ref.
name: publish-action

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # required to push to GHCR

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive :vX.Y.Z, :vX and :latest tags (+ OCI labels) from the git ref.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/action
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (context = repo root, Dockerfile in the action dir)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/github-action/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
