[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verto"
version = "0.0.1"
description = "VERTO — a verified, profile-guided, source-level optimizer (v0: C++)"
requires-python = ">=3.11"
dependencies = [
    # The engine core uses only the stdlib. The C++ Language adapter uses libclang
    # for AST detection (a regex fallback exists, but AST is the intended path).
    # The PyPI package bundles a native libclang, so a fresh venv is self-contained.
    "libclang>=16",
    # .verto.toml parsing: tomllib is stdlib on 3.11+; tomli backports it for older devs.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# LLM proposer backends (build step 6) — install one when wiring the frontier model:
llm-openai = ["openai>=1.0"]
llm-anthropic = ["anthropic>=0.30"]

[project.scripts]
verto = "verto.surfaces.cli:main"

[tool.setuptools.packages.find]
include = ["verto*"]
