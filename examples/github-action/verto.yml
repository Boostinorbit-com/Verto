# ─────────────────────────────────────────────────────────────────────────────
# VERTO — verified C++ optimizations on your pull requests.
#
# HOW TO USE:  copy this file to  .github/workflows/verto.yml  in YOUR repository.
# On every PR it finds provably correct-AND-faster changes on the files the PR
# touched, and comments them. Nothing is applied without your approval.
#
# The absolute minimum is: checkout (fetch-depth 0) → generate compile_commands.json
# → the `verto/action` step with `compile-commands`. Everything else has a default.
# ─────────────────────────────────────────────────────────────────────────────
name: VERTO

on:
  pull_request:                       # run on every pull request
    # paths: ["**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp"]   # (optional) only when C++ changes

permissions:
  contents: read                      # read your source
  pull-requests: write                # post the findings as a PR comment

jobs:
  verto:
    runs-on: ubuntu-latest
    steps:
      # 1) Get the code. fetch-depth: 0 lets VERTO diff against the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Produce compile_commands.json — VERTO needs your REAL compile flags.
      #    CMake does it with one flag; adapt the command to your build system.
      - name: Generate compilation database
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # 3) Run VERTO on the changed files.
      - id: verto
        uses: verto/action@v1
        with:
          # ── the one you almost always set ────────────────────────────────
          compile-commands: build/compile_commands.json   # path to the DB (or a build dir holding it)

          # ── behaviour (all optional — defaults shown) ────────────────────
          mode:         comment            # comment | suggest | pr  (delivery; Prevent = fail-on)
          model:        rules              # rules (no key) | local | frontier
          min-speedup:  "2"                # reject wins below this percent
          min-rung:     "3"                # 1 = differential test, 3 = + sanitizers
          # objectives: p50,p99,peak_memory
          # base-ref:   ${{ github.base_ref }}   # auto-detected from the PR by default
          # include:    "src/**"           # only consider these paths
          # exclude:    "third_party/**"   # skip these paths
          # jobs:       "4"                # verify N translation units in parallel
          # budget:     "$0.50"            # LLM spend cap: tokens (500k) | money ($2) | time (90s)
          # fail-on:    none               # none | any  (any = Prevent: fail if a verified win is left unapplied; `regression` vs baseline is planned)
          # metamorphic: "false"           # also run the opt-in metamorphic rung
          # config-file: .verto.toml       # team defaults live here

          # ── tokens & secrets — pass SECRETS, never literals ──────────────
          github-token: ${{ github.token }}            # to post the PR comment (this is the default)
          # api-key:    ${{ secrets.OPENAI_API_KEY }}  # ONLY if model: frontier
          # llm-url:    https://api.openai.com         # ONLY if model: frontier
          # verto-token: ${{ secrets.VERTO_TOKEN }}    # only for VERTO HOSTED features (managed model / clean-room bench); the free self-run Action needs none

      # 4) (optional) Use VERTO's outputs in later steps.
      - name: Summary
        if: always()
        run: |
          echo "status   = ${{ steps.verto.outputs.status }}"     # clean | found | regressed
          echo "findings = ${{ steps.verto.outputs.findings }}"   # number of verified optimizations
          echo "report   = ${{ steps.verto.outputs.report-json }}"
